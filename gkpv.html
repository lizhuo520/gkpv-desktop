<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gkpv – 轻量照片浏览器</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-secondary: #252525;
    --bg-hover: #333;
    --text: #e0e0e0;
    --text-muted: #888;
    --accent: #4a9eff;
    --accent-hover: #6bb3ff;
    --border: #333;
    --thumb-sm: 120px;
    --thumb-md: 200px;
    --thumb-lg: 320px;
    --thumb-size: var(--thumb-md);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---------- toolbar ---------- */
  #toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  #toolbar .brand {
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    margin-right: 8px;
    user-select: none;
  }

  #toolbar button, #toolbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  #toolbar button:hover, #toolbar select:hover {
    background: var(--bg-hover);
  }

  #breadcrumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    font-size: 13px;
    white-space: nowrap;
  }
  #breadcrumbs span {
    color: var(--text-muted);
    user-select: none;
  }
  #breadcrumbs button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 13px;
  }
  #breadcrumbs button:hover { text-decoration: underline; }

  .size-group {
    display: flex;
    gap: 0;
  }
  .size-group button {
    border-radius: 0;
    padding: 6px 10px;
    font-size: 12px;
  }
  .size-group button:first-child { border-radius: 6px 0 0 6px; }
  .size-group button:last-child { border-radius: 0 6px 6px 0; }
  .size-group button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ---------- landing ---------- */
  #landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
    gap: 20px;
    text-align: center;
  }
  #landing h1 { font-size: 48px; color: var(--accent); }
  #landing p { color: var(--text-muted); font-size: 15px; max-width: 420px; }
  #landing button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    font-size: 16px;
    cursor: pointer;
    transition: background .15s;
  }
  #landing button:hover { background: var(--accent-hover); }

  /* ---------- grid ---------- */
  #gallery {
    display: none;
    padding: 16px;
  }

  .dir-section {
    margin-bottom: 24px;
  }
  .dir-section h3 {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--thumb-size), 1fr));
    gap: 8px;
  }

  .card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-secondary);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    aspect-ratio: 1;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 6px 6px;
    font-size: 11px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .folder-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
  }
  .folder-card:hover { background: var(--bg-hover); }
  .folder-card .folder-icon { font-size: 48px; line-height: 1; }
  .folder-card .label {
    position: static;
    background: none;
    color: var(--text);
    text-align: center;
    padding: 0 8px;
    font-size: 13px;
  }

  /* ---------- lightbox ---------- */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 95vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    user-select: none;
    will-change: transform;
    transform-origin: center center;
    touch-action: none;
  }
  #lightbox img.zoom-in-cursor { cursor: zoom-in; }
  #lightbox img.zoom-out-cursor { cursor: zoom-out; }
  #lightbox img.grab-cursor { cursor: grab; }
  #lightbox img.grabbing-cursor { cursor: grabbing; }

  #lbImgPrev {
    position: absolute;
    pointer-events: none;
    z-index: 205;
    opacity: 0;
    transition: opacity 0.3s ease;
    will-change: opacity;
    transform: none;
  }

  #lbZoom {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 210;
  }
  #lbZoom.visible { opacity: 1; }

  /* ---------- 光箱失败提示（HEIC / RAW 无内嵌预览等） ---------- */
  #lightbox .lb-msg {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 70vw;
    padding: 16px 24px;
    background: rgba(0, 0, 0, .82);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
    z-index: 208;
  }
  #lightbox .lb-msg.show { display: block; }

  .info-btn {
    position: absolute;
    top: 16px;
    right: 64px;
    background: rgba(255,255,255,.1);
    border: none;
    color: #fff;
    font-size: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s;
    z-index: 210;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .info-btn:hover { background: rgba(255,255,255,.25); }
  .info-btn.active { background: var(--accent); }

  .exif-panel {
    display: none;
    position: absolute;
    top: 64px;
    right: 16px;
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 16px;
    min-width: 240px;
    max-width: 320px;
    color: #e0e0e0;
    font-size: 12px;
    z-index: 210;
    max-height: 70vh;
    overflow-y: auto;
  }
  .exif-panel.open { display: block; }
  .exif-panel .exif-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .exif-panel .exif-row:last-child { border-bottom: none; }
  .exif-panel .exif-label { color: #888; margin-right: 12px; white-space: nowrap; }
  .exif-panel .exif-value { text-align: right; word-break: break-word; }
  .exif-panel .exif-heading {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin: 10px 0 4px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .exif-panel .exif-heading:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  #lightbox .info {
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #lightbox .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.1);
    border: none;
    color: #fff;
    font-size: 28px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lightbox .nav-btn:hover { background: rgba(255,255,255,.25); }
  #lightbox .nav-prev { left: 16px; }
  #lightbox .nav-next { right: 16px; }

  #lightbox .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,.1);
    border: none;
    color: #fff;
    font-size: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s;
  }
  #lightbox .close-btn:hover { background: rgba(255,255,255,.25); }

  /* ---------- counter ---------- */
  #counter {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ---------- loading ---------- */
  #loading {
    display: none;
    text-align: center;
    padding: 60px;
    color: var(--text-muted);
    font-size: 14px;
  }
  #loading.show { display: block; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- sort ---------- */
  #sortSelect { min-width: 100px; }

#recursiveBtn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* 递归模式下卡片左上角的「来源子文件夹」标注 */
.subfolder-badge {
  position: absolute;
  top: 4px;
  left: 4px;
  right: 4px;
  padding: 2px 6px;
  font-size: 10px;
  line-height: 1.4;
  color: #fff;
  background: rgba(0, 0, 0, .62);
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

  /* ---------- shimmer placeholder ---------- */
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-hover) 50%, var(--bg-secondary) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    z-index: 1;
  }
  .card.thumb-ready::before { display: none; }
  .card.folder-card::before { display: none; }

  /* ---------- thumbnail fade-in ---------- */
  .card img {
    opacity: 0;
    transition: opacity .3s;
  }
  .card img.loaded {
    opacity: 1;
  }

  /* ---------- 浏览器无法解码的格式（HEIC/HEIF）---------- */
  .card.unsupported {
    background: repeating-linear-gradient(45deg, var(--bg-secondary) 0 10px, var(--bg-hover) 10px 20px);
  }
  .card .unsupported-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 2px 8px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-muted);
    background: rgba(0, 0, 0, .35);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  /* ---------- layout toggle ---------- */
  .layout-group {
    display: flex;
    gap: 0;
  }
  .layout-group button {
    border-radius: 0;
    padding: 6px 10px;
    font-size: 12px;
  }
  .layout-group button:first-child { border-radius: 6px 0 0 6px; }
  .layout-group button:last-child { border-radius: 0 6px 6px 0; }
  .layout-group button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ---------- virtual scroll ---------- */
  .vs-container {
    position: relative;
    overflow: visible;
  }
  .vs-spacer {
    width: 100%;
    pointer-events: none;
  }
  .vs-row {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    gap: 8px;
  }
  .vs-row .card {
    flex-shrink: 0;
    aspect-ratio: auto;
  }
  .vs-row .card .label {
    opacity: 0;
    transition: opacity .15s;
  }
  .vs-row .card:hover .label {
    opacity: 1;
  }

  /* ---------- card tooltip ---------- */
  .card-tooltip {
    position: fixed;
    background: rgba(0,0,0,.9);
    color: #e0e0e0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 150;
    max-width: 280px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .card-tooltip.visible { opacity: 1; }
  .card-tooltip .tt-name { font-weight: 600; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; display: block; }
  .card-tooltip .tt-detail { color: #999; }

  /* ---------- folder preview mosaic ---------- */
  .folder-mosaic {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    border-radius: 4px;
  }
  .folder-mosaic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .folder-mosaic.single img { grid-column: 1 / -1; grid-row: 1 / -1; }
</style>
</head>
<body>

<!-- Landing -->
<div id="landing">
  <h1>gkpv</h1>
  <p>轻量照片浏览器 —— 完全在浏览器中浏览本地照片库。</p>
  <button id="openBtn">打开文件夹</button>
</div>

<!-- Toolbar -->
<div id="toolbar" style="display:none">
  <span class="brand">gkpv</span>
  <button id="openBtnToolbar" title="打开其他文件夹">打开</button>
  <div id="breadcrumbs"></div>
  <div class="layout-group">
    <button data-layout="grid">网格</button>
    <button data-layout="justified" class="active">自适应</button>
  </div>
  <div class="size-group">
    <button data-size="sm">S</button>
    <button data-size="md" class="active">M</button>
    <button data-size="lg">L</button>
  </div>
  <select id="sortSelect" title="排序方式">
    <option value="name-asc">名称 A–Z</option>
    <option value="name-desc">名称 Z–A</option>
    <option value="date-new">最新</option>
    <option value="date-old">最旧</option>
  </select>
  <button id="recursiveBtn" title="包含所有子文件夹里的图片">子文件夹：关</button>
  <button id="clearCacheBtn" title="清空缩略图缓存">清空缓存</button>
  <span id="counter"></span>
</div>

<!-- Loading -->
<div id="loading"><div class="spinner"></div>正在扫描目录…</div>

<!-- Gallery -->
<div id="gallery"></div>

<!-- Card Tooltip -->
<div id="cardTooltip" class="card-tooltip"></div>

<!-- Lightbox -->
<div id="lightbox">
  <button class="close-btn" title="关闭 (Esc)">&times;</button>
  <button class="info-btn" title="图片信息 (I)">&#9432;</button>
  <div id="exifPanel" class="exif-panel"></div>
  <button class="nav-btn nav-prev" title="上一张 (←)">&#8249;</button>
  <button class="nav-btn nav-next" title="下一张 (→)">&#8250;</button>
  <img id="lbImgPrev" src="" alt="" draggable="false">
  <img id="lbImg" src="" alt="" draggable="false">
  <div id="lbZoom"></div>
  <div id="lbMsg" class="lb-msg"></div>
  <div class="info" id="lbInfo"></div>
</div>

<script>
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','bmp','webp','avif','svg','ico','tiff','tif','heic',
  // 相机 RAW：靠内嵌 JPEG 预览出图，见 readRawPreview()
  'cr2','cr3','crw','nef','nrw','arw','srf','sr2','dng','raf','orf','rw2','pef','srw','erf','kdc','dcr','mos','mrw','mef','3fr','iiq','rwl','r3d','x3f','raw']);

// Thumbnail constants
const THUMB_MAX = 640;
const THUMB_QUALITY = 0.8;
const THUMB_CONCURRENCY = 8;

// 缩略图/尺寸缓存的内容版本号（改动缓存语义时递增，见 cacheKey）
// v3：RAW 缩略图从「按容器方向躺倒」改成「真正旋转到显示朝向」，旧的 v2 缓存必须失效
const CACHE_VERSION = 'v3';

// ---- 格式分类辅助 ----
// Chromium 完全不能解码的格式：<img> / createImageBitmap / ImageDecoder 三条路都不支持。
// 与其让缩略图静默失败、卡片永远是空白的，不如显式标出来（见 createRowElement）。
const NO_DECODE_EXTS = new Set(['heic', 'heif']);

// createImageBitmap 的 imageOrientation 默认值在历史上变过（'none' -> 'from-image'），
// 不同内核、不同版本行为不一致。这里统一显式声明「按 EXIF 方向解码」，
// 保证缩略图与光箱（<img> 默认就是 from-image）的朝向永远一致。
const BITMAP_OPTS = { imageOrientation: 'from-image' };

// 取小写扩展名（无扩展名返回空串）
function extOf(name) {
  const i = String(name).lastIndexOf('.');
  return i < 0 ? '' : String(name).slice(i + 1).toLowerCase();
}

function isNoDecodeName(name) { return NO_DECODE_EXTS.has(extOf(name)); }
function isSvgName(name) { return extOf(name) === 'svg'; }

let rootHandle = null;   // FileSystemDirectoryHandle for the root
let currentPath = [];     // path segments from root
let currentImages = [];   // { name, file, thumbUrl } for lightbox navigation
let lbIndex = 0;
let lbCurrentUrl = null;  // full-size blob URL currently shown in lightbox
let thumbGeneration = 0;  // generation counter to abort stale work
let currentThumbUrls = []; // blob URLs for current thumbnails (for revocation)

// Layout & virtual scroll state
let layoutMode = 'justified'; // 'grid' | 'justified'
let currentSizeKey = 'md';
let layoutRows = [];
let totalHeight = 0;
let renderedRange = { start: -1, end: -1 };
let rowElements = new Map();
let $scrollContainer = null, $spacer = null;
let vsScrollHandler = null, vsResizeHandler = null;
let vsGen = 0; // virtual scroll generation
let currentFolderCount = 0;
let currentDirPath = '';
let thumbQueue = [], thumbQueueIdx = 0, thumbWorkersRunning = 0;
let thumbDoneCount = 0;   // 已完成的缩略图数（避免每次全量 filter 统计）
let thumbFailedCount = 0; // 失败数。失败也必须计入 done，否则计数器永远追不上 total
let thumbFailedNames = [];
let relayoutTimer = null;
let recursiveMode = false;   // 是否递归显示所有子文件夹里的图片
let scanTruncated = false;   // 本次扫描是否因 SCAN_LIMIT 被截断（决定计数器要不要提示）

// 计数器文案：递归时额外说明「含子文件夹」
function updateCounterLabel(total, folders) {
  const img = `${total} 张图片`;
  const fld = `${folders} 个文件夹`;
  let text = recursiveMode
    ? `${img}（含子文件夹），${fld}`
    : `${img}，${fld}`;
  // 被 SCAN_LIMIT 截断时必须说清楚，否则用户会以为图少了
  if (scanTruncated) text += `（已达 ${SCAN_LIMIT} 张上限，未显示全部）`;
  $counter.textContent = text;
}

// OPFS cache state
let cacheDir = null;      // FileSystemDirectoryHandle for gkpv-thumbs in OPFS
const memCache = new Map(); // in-memory fallback if OPFS unavailable

// DOM refs
const $landing   = document.getElementById('landing');
const $toolbar   = document.getElementById('toolbar');
const $gallery   = document.getElementById('gallery');
const $loading   = document.getElementById('loading');
const $lightbox  = document.getElementById('lightbox');
const $lbImg     = document.getElementById('lbImg');
const $lbImgPrev = document.getElementById('lbImgPrev');
const $lbInfo    = document.getElementById('lbInfo');
const $lbMsg     = document.getElementById('lbMsg');
const $crumbs    = document.getElementById('breadcrumbs');
const $counter   = document.getElementById('counter');
const $sort      = document.getElementById('sortSelect');
const $recursive = document.getElementById('recursiveBtn');

// ---- Card tooltip ----
const $tooltip = document.getElementById('cardTooltip');

function showTooltip(entry, x, y) {
  const dims = entry.width ? `${entry.width} × ${entry.height}` : '—';
  const size = formatSize(entry.file.size);
  const date = new Date(entry.file.lastModified).toLocaleDateString();
  $tooltip.innerHTML = `<span class="tt-name">${esc(entry.name)}</span><span class="tt-detail">${esc(dims)} &middot; ${esc(size)} &middot; ${esc(date)}</span>`;
  positionTooltip(x, y);
  $tooltip.classList.add('visible');
}

function positionTooltip(x, y) {
  const pad = 12;
  let left = x + pad, top = y + pad;
  const tw = $tooltip.offsetWidth, th = $tooltip.offsetHeight;
  if (left + tw > window.innerWidth - pad) left = x - tw - pad;
  if (top + th > window.innerHeight - pad) top = y - th - pad;
  $tooltip.style.left = left + 'px';
  $tooltip.style.top = top + 'px';
}

function hideTooltip() {
  $tooltip.classList.remove('visible');
}

function attachTooltip(card, entry) {
  card.addEventListener('mouseenter', e => showTooltip(entry, e.clientX, e.clientY));
  card.addEventListener('mousemove', e => { if ($tooltip.classList.contains('visible')) positionTooltip(e.clientX, e.clientY); });
  card.addEventListener('mouseleave', hideTooltip);
}

// ---- OPFS Cache System ----
async function initCache() {
  try {
    const opfsRoot = await navigator.storage.getDirectory();
    cacheDir = await opfsRoot.getDirectoryHandle('gkpv-thumbs', { create: true });
  } catch (e) {
    console.warn('OPFS unavailable, using in-memory cache:', e);
    cacheDir = null;
  }
}

function cacheKey(dirPath, file) {
  // 带上缓存版本号：只要"缓存内容的语义"变了就递增，旧条目会被自动忽略（自愈，不用手动清缓存）。
  // v2 的原因：EXIF 方向修复前，竖拍的图是按"方向算反的尺寸"生成缩略图的
  //（把已经转正的位图画进了宽高反过来的 canvas 里 → 图被压扁），尺寸 sidecar 也是反的。
  const raw = `${CACHE_VERSION}/${dirPath}/${file.name}_${file.size}_${file.lastModified}`;
  return raw.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 200);
}

// 宽高比缓存的 key（读写都要用它，避免两处写法漂移）
function arCacheKey(dirPath) {
  return `ar_${CACHE_VERSION}_` + dirPath.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 180);
}

async function getCachedThumb(key) {
  if (cacheDir) {
    try {
      const fileHandle = await cacheDir.getFileHandle(key);
      const file = await fileHandle.getFile();
      return file;
    } catch (e) {
      return null;
    }
  }
  return memCache.get(key) || null;
}

async function setCachedThumb(key, blob) {
  if (cacheDir) {
    try {
      const fileHandle = await cacheDir.getFileHandle(key, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    } catch (e) {
      console.warn('Cache write failed:', e);
    }
  } else {
    memCache.set(key, blob);
  }
}

async function clearCache() {
  if (cacheDir) {
    try {
      const opfsRoot = await navigator.storage.getDirectory();
      await opfsRoot.removeEntry('gkpv-thumbs', { recursive: true });
      cacheDir = await opfsRoot.getDirectoryHandle('gkpv-thumbs', { create: true });
    } catch (e) {
      console.warn('Cache clear failed:', e);
    }
  }
  memCache.clear();
}

// ---- Utilities ----
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(1) + ' GB';
}

// ---- Thumbnail Generation ----
// ---- 只读文件头拿像素尺寸（不解码整图，便宜得多）----
// 返回的 w/h 是「显示尺寸」：JPEG 若带 Orientation(0x0112)=5~8，宽高已经互换过，
// 这样算出来的宽高比才与实际解码结果、以及 <img> 的朝向一致（见 readTiffOrientation）。
// 拿不到就返回 null，调用方回退到全图解码，保证不会比原来更差。
async function readImageSize(file) {
  try {
    const HEAD = 262144;               // 256 KB 足够覆盖 SOF/IHDR 等头部
    const buf = new Uint8Array(await file.slice(0, HEAD).arrayBuffer());
    const dv = new DataView(buf.buffer);
    const n = buf.length;

    // SVG 是矢量图、没有固有像素尺寸；HEIC 浏览器根本解不了 —— 都不在这里解析
    if (isNoDecodeName(file.name) || isSvgName(file.name)) return null;

    // PNG：IHDR 固定在第 16 字节
    if (n > 24 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4E && buf[3] === 0x47) {
      return { w: dv.getUint32(16), h: dv.getUint32(20) };
    }
    // GIF
    if (n > 10 && buf[0] === 0x47 && buf[1] === 0x49 && buf[2] === 0x46) {
      return { w: dv.getUint16(6, true), h: dv.getUint16(8, true) };
    }
    // BMP
    if (n > 26 && buf[0] === 0x42 && buf[1] === 0x4D) {
      return { w: dv.getInt32(18, true), h: Math.abs(dv.getInt32(22, true)) };
    }
    // WebP
    if (n > 30 && buf[8] === 0x57 && buf[9] === 0x45 && buf[10] === 0x42 && buf[11] === 0x50) {
      const fmt = String.fromCharCode(buf[12], buf[13], buf[14], buf[15]);
      if (fmt === 'VP8X') {
        return {
          w: 1 + (buf[24] | (buf[25] << 8) | (buf[26] << 16)),
          h: 1 + (buf[27] | (buf[28] << 8) | (buf[29] << 16)),
        };
      }
      if (fmt === 'VP8 ') {
        return { w: dv.getUint16(26, true) & 0x3fff, h: dv.getUint16(28, true) & 0x3fff };
      }
      if (fmt === 'VP8L') {
        const b0 = buf[21], b1 = buf[22], b2 = buf[23], b3 = buf[24];
        return {
          w: 1 + (((b1 & 0x3F) << 8) | b0),
          h: 1 + (((b3 & 0x0F) << 10) | (b2 << 2) | ((b1 & 0xC0) >> 6)),
        };
      }
    }
    // JPEG：逐个 marker 扫到 SOFn（排除 C4=DHT / C8=JPG / CC=DAC）
    // 顺路取 APP1 里的 Orientation(0x0112)：同一个 256KB 头里就能拿到，不用再读一次盘
    if (n > 4 && buf[0] === 0xFF && buf[1] === 0xD8) {
      let i = 2;
      let orientation = 0;
      while (i < n - 9) {
        if (buf[i] !== 0xFF) { i++; continue; }
        const m = buf[i + 1];
        if (m === 0xFF) { i++; continue; }
        if (m >= 0xD0 && m <= 0xD9) { i += 2; continue; }   // 无长度字段的 marker
        if (m === 0xE1 && !orientation) {
          // APP1：「Exif\0\0」之后就是 TIFF 头（可能是缩略图的 APP1，所以只在没取到时试）
          const p = i + 4;
          if (p + 8 <= n && dv.getUint32(p) === 0x45786966 && dv.getUint16(p + 4) === 0) {
            orientation = readTiffOrientation(dv, n, p + 6);
          }
        }
        if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
          let h = dv.getUint16(i + 5), w = dv.getUint16(i + 7);
          // Orientation 5~8 = 需要转 90°，实际显示时宽高是反的
          if (orientation >= 5 && orientation <= 8) { const t = w; w = h; h = t; }
          return { w, h, o: orientation || 1 };
        }
        i += 2 + dv.getUint16(i + 2);                        // 跳过本段
      }
    }
  } catch (e) { /* 解析失败 -> null -> 回退 */ }
  return null;
}

function isSaneSize(s) {
  return s && s.w > 0 && s.h > 0 && s.w < 200000 && s.h < 200000;
}

// 把内存里已有的字节包成 readImageSize() 认识的「file 样对象」（它只用到 slice().arrayBuffer()）。
// 用于：RAW 内嵌预览已经从文件里取出来了，不想为了读它自己的尺寸再读一次盘。
function bytesAsFile(bytes, name) {
  return {
    name,
    size: bytes.length,
    slice: (a, b) => ({
      arrayBuffer: async () => bytes.slice(a || 0, b === undefined ? bytes.length : b).buffer,
    }),
  };
}

// 从 TIFF 头里读 IFD0 的 Orientation(0x0112)。
// t 指向 'II'/'MM' 标志；只认 SHORT(type=3)，取值 1~8，读不到返回 0（等价于「未标注方向」）。
// 专门抽出来是因为：createImageBitmap 会按这个值旋转像素，如果解析尺寸时不跟着换算，
// 得到的宽高比就和真正解码出来的图互为倒数（竖拍照片会一直走全解码慢路径）。
function readTiffOrientation(dv, n, t) {
  if (t + 8 > n) return 0;
  const bo = dv.getUint16(t);
  if (bo !== 0x4949 && bo !== 0x4D4D) return 0;
  const le = bo === 0x4949;
  const ifd = dv.getUint32(t + 4, le);
  if (t + ifd + 2 > n) return 0;
  const cnt = dv.getUint16(t + ifd, le);
  for (let i = 0; i < cnt; i++) {
    const p = t + ifd + 2 + i * 12;
    if (p + 12 > n) break;
    if (dv.getUint16(p, le) === 0x0112) {
      const v = dv.getUint16(p + 8, le);   // SHORT 只占前 2 字节
      return v >= 1 && v <= 8 ? v : 0;
    }
  }
  return 0;
}

// ---- 按 EXIF 方向把位图转正 ----
// 为什么需要它：RAW 的内嵌预览 JPEG 几乎都不带 EXIF 段（实测尼康/索尼 275 个文件里 0 个带），
// 而浏览器只会按「图片自己带的 EXIF」转正 —— 所以预览解码出来是传感器朝向（横躺着）的。
// 方向信息存在 RAW 容器的 IFD0 里，只有我们自己按它旋转像素，缩略图和光箱才是正的。
// orientation 取值 1~8（CIPA DC-008 定义），返回的新画布尺寸 = 转正后的显示尺寸。
// maxSize > 0 时顺便等比缩到该上限（避免先解码成大图再重采样两次）。
function drawBitmapOriented(bmp, orientation, maxSize = 0) {
  const w = bmp.width, h = bmp.height;
  const swap = orientation >= 5 && orientation <= 8;   // 5~8 含 90° 变换：宽高互换
  let cw = swap ? h : w, ch = swap ? w : h;
  const scale = maxSize > 0 ? Math.min(1, maxSize / Math.max(cw, ch)) : 1;
  cw = Math.max(1, Math.round(cw * scale));
  ch = Math.max(1, Math.round(ch * scale));
  const canvas = new OffscreenCanvas(cw, ch);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  // 先按显示尺寸缩放，再叠加方向矩阵：canvas 的 transform() 是右乘，
  // 所以「scale 在前、transform 在后」= 最终矩阵 S·T，平移量会自动一起缩放
  ctx.scale(scale, scale);
  switch (orientation) {
    case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;     // 水平镜像
    case 3: ctx.transform(-1, 0, 0, -1, w, h); break;    // 旋转 180°
    case 4: ctx.transform(1, 0, 0, -1, 0, h); break;     // 垂直镜像
    case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;      // 转置（沿主对角线镜像）
    case 6: ctx.transform(0, 1, -1, 0, h, 0); break;     // 顺时针 90°
    case 7: ctx.transform(0, -1, -1, 0, h, w); break;    // 沿副对角线镜像
    case 8: ctx.transform(0, -1, 1, 0, 0, w); break;     // 逆时针 90°（= 顺时针 270°）
    default: break;                                      // 1 或未知值：原样输出
  }
  ctx.drawImage(bmp, 0, 0);
  return canvas;
}

// ---- 相机 RAW：从 TIFF 容器里抠出内嵌 JPEG 预览 ----
// 主流 RAW（CR2/NEF/ARW/DNG/RAF/ORF/RW2...）都是 TIFF 结构，IFD0 里的
// ThumbOffset(0x0201)/ThumbLength(0x0202) 指向相机内嵌的 JPEG。
// 直接 slice 出来给浏览器解码，不用 demosaic、不用 WASM。
// 拿不到就返回 null，调用方照原样处理 —— 不会让现有格式变差。
const RAW_EXT_SET = new Set(['cr2', 'cr3', 'crw', 'nef', 'nrw', 'arw', 'srf', 'sr2', 'dng', 'raf', 'orf', 'rw2', 'pef', 'srw', 'erf', 'kdc', 'dcr', 'mos', 'mrw', 'mef', '3fr', 'iiq', 'rwl', 'r3d', 'x3f', 'raw']);
const RAW_HEAD = 262144;                 // 256 KB 足够覆盖 IFD0/ExifIFD/SubIFD
const rawPreviewCache = new WeakMap();   // File -> {blob, w, h}，避免重复读

function isRawName(name) {
  return RAW_EXT_SET.has(extOf(name));
}

async function readRawPreview(file) {
  const hit = rawPreviewCache.get(file);
  if (hit) return hit;
  try {
    const buf = new Uint8Array(await file.slice(0, RAW_HEAD).arrayBuffer());
    const dv = new DataView(buf.buffer);
    const n = buf.length;
    if (n < 16) return null;

    let le = null;
    if (buf[0] === 0x49 && buf[1] === 0x49 && buf[2] === 0x2a && buf[3] === 0x00) le = true;
    else if (buf[0] === 0x4d && buf[1] === 0x4d && buf[2] === 0x00 && buf[3] === 0x2a) le = false;
    else return null;

    // 按 TIFF 类型取值：SHORT(type=3) 只占前 2 字节，不能整 4 字节读
    const scan = (off) => {
      const out = {};
      if (off + 2 > n) return out;
      const cnt = dv.getUint16(off, le);
      for (let i = 0; i < cnt; i++) {
        const p = off + 2 + i * 12;
        if (p + 12 > n) break;
        const tag = dv.getUint16(p, le);
        const typ = dv.getUint16(p + 2, le);
        const c = dv.getUint32(p + 4, le);
        out[tag] = { typ, cnt: c, v: typ === 3 ? dv.getUint16(p + 8, le) : dv.getUint32(p + 8, le) };
      }
      return out;
    };

    const t0 = scan(dv.getUint32(4, le));

    // SubIFDs 可能是数组（尼康 cnt=3），也可能只有 1 个
    const subIfdOffsets = () => {
      const s = t0[0x014A];
      if (!s) return [];
      if (s.cnt > 1) {
        const base = s.v;
        const out = [];
        for (let i = 0; i < s.cnt; i++) {
          if (base + 4 * s.cnt > n) break;
          out.push(dv.getUint32(base + 4 * i, le));
        }
        return out;
      }
      return [s.v];
    };
    const subs = subIfdOffsets().map(scan);

    // 收集所有 JPEG 预览候选（IFD0 + 每个 SubIFD）
    const cands = [];
    for (const e of [t0, ...subs]) {
      const o = e[0x0201], l = e[0x0202];
      if (o && l && o.v > 0 && l.v > 0) cands.push([o.v, l.v]);
    }
    // 相机全分辨率尺寸：ExifIFD 优先，其次 SubIFD 里最大的，再其次 IFD0。
    // 注意这三处记的都是「传感器朝向」的尺寸（实测尼康 7424x4924、索尼 7952x5304
    // 都跟着方向 8 一起以横版出现），要按 IFD0 的方向换算才是显示尺寸。
    let sw = 0, sh = 0;
    if (t0[0x8769]) {
      const ex = scan(t0[0x8769].v);
      if (ex[0xA002] && ex[0xA003] && ex[0xA002].v > 0 && ex[0xA003].v > 0) {
        sw = ex[0xA002].v; sh = ex[0xA003].v;
      }
    }
    if (!(sw > 0 && sh > 0)) {
      for (const e of subs) {
        const iw = e[0x0100], ih = e[0x0101];
        if (iw && ih && iw.v > sw && ih.v > 0) { sw = iw.v; sh = ih.v; }
      }
    }
    if (!(sw > 0 && sh > 0) && t0[0x0100] && t0[0x0101]) { sw = t0[0x0100].v; sh = t0[0x0101].v; }

    // IFD0 的 Orientation(0x0112)：相机的「意图方向」，5~8 表示要转 90°
    const orientation = t0[0x0112] && t0[0x0112].v >= 1 && t0[0x0112].v <= 8 ? t0[0x0112].v : 1;

    // 选长度最小的候选。尼康会同时给出全尺寸(2.4MB)和预览(1MB)，
    // 做 640px 缩略图用小的那个就够了。
    cands.sort((a, b) => a[1] - b[1]);
    let chosen = null;
    for (const c of cands) {
      if (c[1] > 8192 && c[1] <= 16 * 1024 * 1024) { chosen = c; break; }
    }
    if (!chosen) return null;

    const bytes = new Uint8Array(await file.slice(chosen[0], chosen[0] + chosen[1]).arrayBuffer());
    // 必须是 JPEG 才能交给浏览器解码
    if (bytes.length < 4 || bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;

    // 预览图自己的尺寸与方向（直接解析刚取出来的字节，不用再读盘）。
    // o > 1 表示这段预览是「自描述」的：浏览器解码时会自己转正，我们不能再转第二次
    const psz = await readImageSize(bytesAsFile(bytes, 'preview.jpg'));
    const previewOriented = !!(psz && psz.o > 1);

    // 需要我们自己补的旋转：只有预览没写方向（实测尼康/索尼都不写）时才按 IFD0 的方向转
    const orient = (!previewOriented && orientation >= 5 && orientation <= 8) ? orientation : 1;

    // 显示尺寸：优先用相机全分辨率（信息面板更好看），但必须和预览像素的实际比例一致；
    // 对不上（>2%）说明这个尺寸的语义不可信，就以预览实际像素为准 —— 布局不会因此排错
    let w = 0, h = 0;
    if (sw > 0 && sh > 0) { w = orientation >= 5 ? sh : sw; h = orientation >= 5 ? sw : sh; }
    if (psz && psz.w > 0 && psz.h > 0) {
      let bw = psz.w, bh = psz.h;                        // 浏览器解码预览后的像素尺寸
      if (orient >= 5) { const t = bw; bw = bh; bh = t; } // 我们再转 90° 之后
      if (!(w > 0 && h > 0) || Math.abs(w / h - bw / bh) / (bw / bh) > 0.02) { w = bw; h = bh; }
    }
    if (!(w > 0 && h > 0)) return null;

    const res = { blob: new Blob([bytes], { type: 'image/jpeg' }), w, h, orient };
    rawPreviewCache.set(file, res);
    return res;
  } catch (e) {
    return null;
  }
}


// lightbox 用：给出「浏览器能解码的 Blob」。
// 这里必须是 async 且按需读取：rawPreviewCache 只有当 readRawPreview() 真的跑过才有值，
// 而缩略图命中 OPFS 缓存、或宽高比命中 ar_ 缓存时，那个函数一次都不会被调用。
// 只查缓存就会复现「缩略图正常、双击打开一片空白」—— <img> 拿到的是 RAW 原始文件，
// 浏览器解不了，于是什么都不显示。readRawPreview 内部有 WeakMap 缓存，重复调用不重复读盘。
async function fullBlobFor(entry) {
  if (!entry || !entry.file) return null;
  if (isNoDecodeName(entry.file.name)) return null;   // HEIC 等：浏览器解不了，交给调用方提示
  if (isRawName(entry.file.name)) {
    const pv = await readRawPreview(entry.file);
    if (!pv) return null;                             // 取不到内嵌预览 -> null
    // pv.orient > 1：内嵌预览不带 EXIF 方向，<img> 不会替我们转，必须先转正再交给它，
    // 否则光箱里是躺倒的（缩略图走 generateThumb，同样按方向转）
    if (pv.orient <= 1) return pv.blob;
    try {
      const bmp = await createImageBitmap(pv.blob, BITMAP_OPTS);
      const canvas = drawBitmapOriented(bmp, pv.orient);
      bmp.close();
      return await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.92 });
    } catch (e) {
      return pv.blob;                                 // 转不动就退回未转正的预览，至少有图
    }
  }
  return entry.file;
}

// ---- SVG 缩略图 ----
// createImageBitmap 不支持 SVG Blob（Chromium 官方 issue 40269670：SVG 渲染依赖 DOM，
// 无法离主线程），只能走 <img> 解码。
async function loadSvgImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  try {
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('SVG 解码失败'));
      img.src = url;
    });
  } catch (e) {
    URL.revokeObjectURL(url);   // 失败路径也要回收 URL
    throw e;
  }
  return { img, url };
}

// 矢量图没有固有像素尺寸：naturalWidth 取不到就按 512 兜底
async function generateSvgThumb(file) {
  const { img, url } = await loadSvgImage(file);
  try {
    const ow = img.naturalWidth || 512;
    const oh = img.naturalHeight || 512;
    const scale = Math.min(1, THUMB_MAX / Math.max(ow, oh));
    const w = Math.max(1, Math.round(ow * scale));
    const h = Math.max(1, Math.round(oh * scale));
    const canvas = new OffscreenCanvas(w, h);
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    // SVG 常带透明背景：用 PNG 保留透明度（JPEG 会把透明区域画成黑色）
    const blob = await canvas.convertToBlob({ type: 'image/png' });
    return { blob, width: ow, height: oh };
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function generateThumb(file) {
  const name = file && file.name;

  // 浏览器解不了的格式（HEIC/HEIF）直接抛错，让调用方标成「不支持」，
  // 没必要白走一遍必然失败的解码
  if (isNoDecodeName(name)) throw new Error(`浏览器无法解码 ${extOf(name).toUpperCase()} 格式`);

  // RAW：走内嵌 JPEG 预览，别让浏览器去啃解不了的传感器数据
  if (isRawName(name)) {
    const pv = await readRawPreview(file);
    if (!pv) throw new Error('无法从 RAW 中取出内嵌预览图');
    // 内嵌预览不带 EXIF 方向（见 drawBitmapOriented），像素是传感器朝向，
    // 必须自己按 pv.orient 转正；转完宽高会互换，所以不能按转之前的长宽去缩放
    const bmp = await createImageBitmap(pv.blob, BITMAP_OPTS);
    const canvas = drawBitmapOriented(bmp, pv.orient, THUMB_MAX);
    bmp.close();
    const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: THUMB_QUALITY });
    // 尺寸优先报「相机全分辨率显示尺寸」（信息面板更好看）；对不上实际像素比例（>2%）
    // 时才以实际像素为准，否则 justified 布局会按错误的比例排版
    const cw = canvas.width, ch = canvas.height;
    const sameAR = pv.w > 0 && pv.h > 0 && Math.abs(pv.w / pv.h - cw / ch) / (cw / ch) < 0.02;
    return sameAR ? { blob, width: pv.w, height: pv.h } : { blob, width: cw, height: ch };
  }

  // SVG：createImageBitmap 不支持 SVG Blob，必须走 <img>（见 generateSvgThumb）
  if (isSvgName(name)) return await generateSvgThumb(file);

  const declared = await readImageSize(file);

  if (isSaneSize(declared)) {
    const ow = declared.w, oh = declared.h;
    const needResize = Math.max(ow, oh) > THUMB_MAX;
    const portrait = oh > ow;
    let bmp = null;
    try {
      // 只传一个维度，保持长宽比（两个都传会拉伸变形）；并显式按 EXIF 方向解码
      bmp = needResize
        ? await createImageBitmap(file, {
            ...BITMAP_OPTS,
            resizeQuality: 'high',
            ...(portrait ? { resizeHeight: THUMB_MAX } : { resizeWidth: THUMB_MAX }),
          })
        : await createImageBitmap(file, BITMAP_OPTS);
    } catch (e) {
      bmp = null;
    }

    if (bmp) {
      // 校验：真实解码出来的宽高比必须和文件头解析的一致，否则说明解析不可信。
      // （readImageSize 现在已把 EXIF 方向算进去，所以竖拍照片也能走这条快路径）
      const parsedAR = ow / oh;
      const realAR = bmp.width / bmp.height;
      if (Math.abs(realAR - parsedAR) / parsedAR < 0.02) {
        const scale = Math.min(1, THUMB_MAX / Math.max(ow, oh));
        const tw = Math.max(1, Math.round(ow * scale));
        const th = Math.max(1, Math.round(oh * scale));
        const canvas = new OffscreenCanvas(tw, th);
        canvas.getContext('2d').drawImage(bmp, 0, 0, tw, th);
        bmp.close();
        const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: THUMB_QUALITY });
        return { blob, width: ow, height: oh };
      }
      bmp.close();
    }
  }

  // 回退路径：与优化前完全一致的实现（同样显式声明 EXIF 方向）
  const bitmap = await createImageBitmap(file, BITMAP_OPTS);
  const origW = bitmap.width, origH = bitmap.height;
  let w = origW, h = origH;
  if (w > THUMB_MAX || h > THUMB_MAX) {
    const scale = Math.min(THUMB_MAX / w, THUMB_MAX / h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  const canvas = new OffscreenCanvas(w, h);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close();
  const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: THUMB_QUALITY });
  return { blob, width: origW, height: origH };
}

async function getOrCreateThumb(dirPath, file) {
  const key = cacheKey(dirPath, file);
  const cached = await getCachedThumb(key);
  if (cached) {
    const url = URL.createObjectURL(cached);
    // Try to load dimensions from metadata sidecar
    let width = 0, height = 0;
    try {
      if (cacheDir) {
        const mh = await cacheDir.getFileHandle(key + '_m');
        const mf = await mh.getFile();
        const meta = JSON.parse(await mf.text());
        if (typeof meta.w === 'number' && typeof meta.h === 'number') {
          width = meta.w; height = meta.h;
        }
      }
    } catch (e) { /* no metadata yet */ }
    return { url, width, height };
  }
  const { blob, width, height } = await generateThumb(file);
  await setCachedThumb(key, blob);
  // Store dimensions metadata sidecar
  try {
    if (cacheDir) {
      const mh = await cacheDir.getFileHandle(key + '_m', { create: true });
      const mw = await mh.createWritable();
      await mw.write(JSON.stringify({ w: width, h: height }));
      await mw.close();
    }
  } catch (e) { /* ignore */ }
  const url = URL.createObjectURL(blob);
  return { url, width, height };
}

// ---- Scan a directory (single level, or the whole tree when recursive) ----
// SCAN_LIMIT 是图片总数上限（顶层 + 递归一起算），防止误选整个盘把内存吃光
const SCAN_LIMIT = 20000;

async function scanDir(dirHandle, recursive) {
  const rootPath = currentPath.join('/');
  const folders = [];
  const images = [];
  let dirCount = 0;         // 递归遍历到的子目录数（用于计数器里的"含子文件夹"）
  let truncated = false;    // 是否被 SCAN_LIMIT 截断

  for await (const [name, handle] of dirHandle) {
    if (name.startsWith('.')) continue;
    if (handle.kind === 'directory') {
      folders.push({ name, handle });
      continue;
    }
    if (!IMAGE_EXTS.has(extOf(name))) continue;
    // 顶层同样要受上限约束（原来只限制递归部分，目录本身超 2 万张就守不住了）
    if (images.length >= SCAN_LIMIT) { truncated = true; break; }
    const file = await handle.getFile();
    // rel 记录相对根目录的路径（含文件名），dirPath 用于缩略图缓存去重
    images.push({ name, file, handle, rel: name, dirPath: rootPath });
  }

  if (recursive) {
    // 广度优先遍历所有子目录，把里面的图摊平到同一层
    const queue = folders.map(f => ({ handle: f.handle, rel: f.name }));
    while (queue.length && images.length < SCAN_LIMIT) {
      const cur = queue.shift();
      dirCount++;
      for await (const [name, h] of cur.handle) {
        if (name.startsWith('.')) continue;
        const childRel = cur.rel + '/' + name;
        if (h.kind === 'directory') {
          queue.push({ handle: h, rel: childRel });
          continue;
        }
        if (!IMAGE_EXTS.has(extOf(name))) continue;
        if (images.length >= SCAN_LIMIT) { truncated = true; break; }
        const file = await h.getFile();
        images.push({
          name,
          file,
          handle: h,
          rel: childRel,
          dirPath: rootPath + '/' + cur.rel,
        });
      }
    }
    // 队列没走空 = 是被上限截断的
    if (queue.length) truncated = true;
  }

  return { folders, images, dirCount, truncated };
}

// ---- Sort helper ----
function sortItems(items) {
  const order = $sort.value;
  const copy = [...items];
  // 递归模式下按「子目录/文件名」排序，让同一文件夹的图聚在一起
  const key = (x) => (recursiveMode && x.rel ? x.rel : x.name);
  switch (order) {
    case 'name-asc':
      copy.sort((a, b) => key(a).localeCompare(key(b), undefined, { numeric: true }));
      break;
    case 'name-desc':
      copy.sort((a, b) => key(b).localeCompare(key(a), undefined, { numeric: true }));
      break;
    case 'date-new':
      copy.sort((a, b) => (b.file?.lastModified || 0) - (a.file?.lastModified || 0));
      break;
    case 'date-old':
      copy.sort((a, b) => (a.file?.lastModified || 0) - (b.file?.lastModified || 0));
      break;
  }
  return copy;
}

// ---- Layout calculators ----
function getTargetRowHeight() {
  const map = { sm: 150, md: 220, lg: 320 };
  return map[currentSizeKey] || 220;
}

function getThumbSizePx() {
  const map = { sm: 120, md: 200, lg: 320 };
  return map[currentSizeKey] || 200;
}

function computeJustifiedLayout(entries, containerWidth) {
  const rows = [];
  const gap = 8;
  const targetH = getTargetRowHeight();
  let row = [], rowAspectSum = 0;
  let y = 0;

  for (let i = 0; i < entries.length; i++) {
    const aspect = entries[i].aspect || 1;
    row.push(i);
    rowAspectSum += aspect;
    const usableW = containerWidth - gap * (row.length - 1);
    const rowH = usableW / rowAspectSum;

    if (rowH <= targetH && row.length > 0) {
      // Row is full
      const h = Math.round(rowH);
      let x = 0;
      const items = row.map(idx => {
        const w = Math.round((entries[idx].aspect || 1) * h);
        const item = { imageIndex: idx, width: w, height: h, left: x };
        x += w + gap;
        return item;
      });
      rows.push({ top: y, height: h, items });
      y += h + gap;
      row = []; rowAspectSum = 0;
    }
  }

  // Last row — left-aligned at target height
  if (row.length > 0) {
    const h = Math.round(Math.min(targetH, (containerWidth - gap * (row.length - 1)) / rowAspectSum));
    let x = 0;
    const items = row.map(idx => {
      const w = Math.round((entries[idx].aspect || 1) * h);
      const item = { imageIndex: idx, width: w, height: h, left: x };
      x += w + gap;
      return item;
    });
    rows.push({ top: y, height: h, items });
    y += h + gap;
  }

  return { rows, totalHeight: y };
}

function computeGridLayout(entries, containerWidth) {
  const gap = 8;
  const thumbSize = getThumbSizePx();
  const cols = Math.max(1, Math.floor((containerWidth + gap) / (thumbSize + gap)));
  const cellW = Math.floor((containerWidth - gap * (cols - 1)) / cols);
  const rows = [];
  let y = 0;

  for (let i = 0; i < entries.length; i += cols) {
    const rowItems = [];
    for (let c = 0; c < cols && i + c < entries.length; c++) {
      rowItems.push({ imageIndex: i + c, width: cellW, height: cellW, left: c * (cellW + gap) });
    }
    rows.push({ top: y, height: cellW, items: rowItems });
    y += cellW + gap;
  }

  return { rows, totalHeight: y };
}

// ---- Virtual scroll engine ----
function findFirstVisibleRow(scrollTop) {
  let lo = 0, hi = layoutRows.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (layoutRows[mid].top + layoutRows[mid].height < scrollTop) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function createRowElement(row, gen) {
  const div = document.createElement('div');
  div.className = 'vs-row';
  div.style.top = row.top + 'px';
  div.style.height = row.height + 'px';
  for (const item of row.items) {
    const entry = currentImages[item.imageIndex];
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = item.width + 'px';
    card.style.height = item.height + 'px';
    card.style.position = 'absolute';
    card.style.left = item.left + 'px';
    const img = document.createElement('img');
    img.alt = entry.name;
    if (entry.unsupported) {
      // 浏览器解不了的格式（HEIC 等）：不要留一张永远转圈的 shimmer，
      // 直接标出格式名，点开光箱也会给出同样的提示
      card.classList.add('thumb-ready', 'unsupported');
      const ph = document.createElement('span');
      ph.className = 'unsupported-icon';
      ph.textContent = extOf(entry.name).toUpperCase();
      card.appendChild(ph);
    } else if (entry.thumbUrl) {
      img.src = entry.thumbUrl;
      img.classList.add('loaded');
      card.classList.add('thumb-ready');
    }
    entry._currentImgEl = img;
    entry._currentCardEl = card;
    card.appendChild(img);
    const lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = entry.name;
    card.appendChild(lbl);
    // 递归模式下标出来源子文件夹（顶层文件的 rel 里没有 /，就不标）
    if (recursiveMode && entry.rel && entry.rel.indexOf('/') >= 0) {
      const sub = document.createElement('span');
      sub.className = 'subfolder-badge';
      sub.textContent = entry.rel.slice(0, entry.rel.lastIndexOf('/'));
      card.appendChild(sub);
    }
    const idx = item.imageIndex;
    card.addEventListener('click', () => openLightbox(idx));
    attachTooltip(card, entry);
    div.appendChild(card);
  }
  return div;
}

function renderVisibleRows() {
  if (!$scrollContainer || !layoutRows.length) return;
  const gen = vsGen;
  const containerRect = $scrollContainer.getBoundingClientRect();
  const viewTop = -containerRect.top;
  const viewBottom = viewTop + window.innerHeight;
  const buffer = 5;

  let startRow = findFirstVisibleRow(Math.max(0, viewTop));
  startRow = Math.max(0, startRow - buffer);
  let endRow = startRow;
  while (endRow < layoutRows.length && layoutRows[endRow].top < viewBottom) endRow++;
  endRow = Math.min(layoutRows.length - 1, endRow + buffer);

  // Remove rows that left viewport
  for (const [ri, el] of rowElements) {
    if (ri < startRow || ri > endRow) {
      el.remove();
      rowElements.delete(ri);
    }
  }

  // Add rows that entered
  for (let ri = startRow; ri <= endRow; ri++) {
    if (!rowElements.has(ri)) {
      const el = createRowElement(layoutRows[ri], gen);
      $scrollContainer.appendChild(el);
      rowElements.set(ri, el);
      enqueueRowThumbnails(layoutRows[ri]);
    }
  }

  renderedRange = { start: startRow, end: endRow };
}

function recalculateLayout() {
  if (!$scrollContainer || !currentImages.length) return;
  const containerWidth = $scrollContainer.clientWidth;
  if (containerWidth <= 0) return;

  const result = layoutMode === 'justified'
    ? computeJustifiedLayout(currentImages, containerWidth)
    : computeGridLayout(currentImages, containerWidth);

  layoutRows = result.rows;
  totalHeight = result.totalHeight;
  $spacer.style.height = totalHeight + 'px';

  // Remove all rendered rows and re-render
  for (const [, el] of rowElements) el.remove();
  rowElements.clear();
  renderedRange = { start: -1, end: -1 };
  renderVisibleRows();
}

function setupVirtualScroll() {
  vsGen++;
  let scrollRaf = false;
  vsScrollHandler = () => {
    if (scrollRaf) return;
    scrollRaf = true;
    requestAnimationFrame(() => { scrollRaf = false; renderVisibleRows(); });
  };
  let resizeRaf = false;
  vsResizeHandler = () => {
    if (resizeRaf) return;
    resizeRaf = true;
    requestAnimationFrame(() => { resizeRaf = false; recalculateLayout(); });
  };
  window.addEventListener('scroll', vsScrollHandler, { passive: true });
  window.addEventListener('resize', vsResizeHandler);
}

function teardownVirtualScroll() {
  if (vsScrollHandler) { window.removeEventListener('scroll', vsScrollHandler); vsScrollHandler = null; }
  if (vsResizeHandler) { window.removeEventListener('resize', vsResizeHandler); vsResizeHandler = null; }
  for (const [, el] of rowElements) el.remove();
  rowElements.clear();
  layoutRows = [];
  renderedRange = { start: -1, end: -1 };
  $scrollContainer = null; $spacer = null;
  thumbQueue = []; thumbQueueIdx = 0;
}

// ---- Visibility-aware thumbnail queue ----
function enqueueRowThumbnails(row) {
  for (const item of row.items) {
    const entry = currentImages[item.imageIndex];
    // 浏览器解不了的格式（HEIC 等）不排队：卡片直接显示占位，也不该计入"生成失败"
    if (entry.unsupported) continue;
    if (!entry.thumbUrl && !entry._thumbQueued) {
      entry._thumbQueued = true;
      thumbQueue.push(item.imageIndex);
    }
  }
  startThumbWorkers();
}

function startThumbWorkers() {
  const gen = thumbGeneration;
  while (thumbWorkersRunning < THUMB_CONCURRENCY && thumbQueueIdx < thumbQueue.length) {
    thumbWorkersRunning++;
    (async () => {
      while (thumbQueueIdx < thumbQueue.length) {
        const idx = thumbQueue[thumbQueueIdx++];
        if (gen !== thumbGeneration) break;
        const entry = currentImages[idx];
        if (entry.thumbUrl) continue;
        try {
          const thumbResult = await getOrCreateThumb(entry.dirPath || currentDirPath, entry.file);
          if (gen !== thumbGeneration) { URL.revokeObjectURL(thumbResult.url); break; }
          entry.thumbUrl = thumbResult.url;
          thumbDoneCount++;
          currentThumbUrls.push(thumbResult.url);
          const hadAspect = entry.width > 0;
          if (thumbResult.width) { entry.width = thumbResult.width; entry.height = thumbResult.height; entry.aspect = thumbResult.width / thumbResult.height; }
          // Update DOM element if it exists
          if (entry._currentImgEl) {
            entry._currentImgEl.src = entry.thumbUrl;
            entry._currentImgEl.onload = () => {
              entry._currentImgEl.classList.add('loaded');
              if (entry._currentCardEl) entry._currentCardEl.classList.add('thumb-ready');
            };
          }
          // Schedule relayout if we discovered a new aspect ratio
          if (!hadAspect && entry.width > 0) scheduleRelayout();
        } catch (e) {
          console.warn('Thumb failed for', entry.name, e);
          // 关键：失败也要计数。原来这里不计数，导致只要有一张失败，
          // done 永远到不了 total，计数器就一直停在"正在生成缩略图"。
          thumbDoneCount++;
          thumbFailedCount++;
          if (thumbFailedNames.length < 50) thumbFailedNames.push(entry.name);
          entry._thumbFailed = true;
          if (entry._currentCardEl) entry._currentCardEl.classList.add('thumb-ready');
        }
        // Update counter
        const done = thumbDoneCount;
        const total = currentImages.length;
        if (gen === thumbGeneration) {
          if (done < total) {
            $counter.textContent = `正在生成缩略图 (${done}/${total})…`;
          } else {
            updateCounterLabel(total, currentFolderCount);
            if (thumbFailedCount) {
              $counter.textContent += `（${thumbFailedCount} 张缩略图生成失败）`;
              // 悬停能看到具体是哪几张，方便排查
              $counter.title = thumbFailedNames.join('\n');
              $counter.style.color = 'var(--text-warning, #c8761a)';
            }
          }
        }
      }
      thumbWorkersRunning--;
    })();
  }
}

function scheduleRelayout() {
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(() => {
    if ($scrollContainer) recalculateLayout();
    saveAspectRatios(currentDirPath, currentImages);
  }, 200);
}

// ---- Folder preview thumbnails ----
const FOLDER_THUMB_MAX = 160;

async function scanFolderPreview(folderHandle, max = 4) {
  const files = [];
  try {
    for await (const [name, handle] of folderHandle) {
      if (handle.kind !== 'file') continue;
      const ext = extOf(name);
      // HEIC 之类解不了的不要选中，否则整张拼图卡片都会失败
      if (IMAGE_EXTS.has(ext) && !isNoDecodeName(name)) {
        files.push(await handle.getFile());
        if (files.length >= max) break;
      }
    }
  } catch (e) { /* permission or read error */ }
  return files;
}

// 拼图缩略图：RAW 要走内嵌预览（否则 createImageBitmap 直接抛异常，
// 结果是「只要有 RAW 的文件夹，整张卡片都没有拼图」），SVG 走 <img>，其余照旧
async function generateFolderThumb(file) {
  let source = file;
  let svg = null;
  let bmp = null;
  let orient = 1;                     // RAW 内嵌预览需要我们自己补的旋转，见 drawBitmapOriented
  if (isRawName(file.name)) {
    const pv = await readRawPreview(file);
    if (!pv) throw new Error('无法从 RAW 中取出内嵌预览图');
    source = pv.blob;
    orient = pv.orient;
  } else if (isSvgName(file.name)) {
    svg = await loadSvgImage(file);   // HTMLImageElement 可以直接 drawImage
    source = svg.img;
  }
  try {
    bmp = source instanceof HTMLImageElement ? source : await createImageBitmap(source, BITMAP_OPTS);
    if (orient > 1) {
      // 传感器的像素朝向：按 IFD0 方向转正（顺带缩到拼图上限），别把躺倒的图拼进去
      const canvas = drawBitmapOriented(bmp, orient, FOLDER_THUMB_MAX);
      return await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.6 });
    }
    let w = bmp.naturalWidth || bmp.width || 160;
    let h = bmp.naturalHeight || bmp.height || 160;
    if (w > FOLDER_THUMB_MAX || h > FOLDER_THUMB_MAX) {
      const scale = Math.min(FOLDER_THUMB_MAX / w, FOLDER_THUMB_MAX / h);
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
    }
    const canvas = new OffscreenCanvas(w, h);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bmp, 0, 0, w, h);
    return await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.6 });
  } finally {
    if (bmp && bmp !== source) bmp.close();   // ImageBitmap 必须显式释放
    if (svg) URL.revokeObjectURL(svg.url);
  }
}

async function getFolderThumb(dirPath, file) {
  const key = 'fp_' + cacheKey(dirPath, file);
  const cached = await getCachedThumb(key);
  if (cached) return URL.createObjectURL(cached);
  const blob = await generateFolderThumb(file);
  await setCachedThumb(key, blob);
  return URL.createObjectURL(blob);
}

async function loadFolderPreviews(folderCards, gen) {
  for (const card of folderCards) {
    if (gen !== thumbGeneration) return;
    try {
      const files = await scanFolderPreview(card._folderHandle);
      if (gen !== thumbGeneration) return;
      if (files.length === 0) continue;

      const dirPath = [...currentPath, card._folderName].join('/');
      const urls = [];
      for (const f of files) {
        if (gen !== thumbGeneration) return;
        const url = await getFolderThumb(dirPath, f);
        if (gen !== thumbGeneration) { URL.revokeObjectURL(url); return; }
        urls.push(url);
        currentThumbUrls.push(url);
      }

      // Replace icon with mosaic
      const icon = card.querySelector('.folder-icon');
      if (icon) {
        const mosaic = document.createElement('div');
        mosaic.className = 'folder-mosaic' + (urls.length === 1 ? ' single' : '');
        for (const url of urls) {
          const img = document.createElement('img');
          img.src = url;
          mosaic.appendChild(img);
        }
        icon.replaceWith(mosaic);
      }
    } catch (e) { /* skip folder */ }
  }
}

// ---- Render current directory ----
async function renderDirectory() {
  const gen = ++thumbGeneration;

  // Cleanup
  revokeCurrentUrls();
  teardownVirtualScroll();
  lbReleaseExcept(new Set());   // 顺手释放光箱预载的 URL（空集合 = 全部释放）

  $gallery.innerHTML = '';
  $loading.classList.add('show');
  $gallery.style.display = 'none';

  try {
    const dirHandle = await getDirHandle(currentPath);
    const { folders, images, dirCount, truncated } = await scanDir(dirHandle, recursiveMode);

    if (gen !== thumbGeneration) return;

    const sortedFolders = sortItems(folders);
    const sortedImages = sortItems(images);

    currentDirPath = currentPath.join('/');
    // 递归模式下列表里的图来自所有子目录，所以计数器显示真正遍历到的目录数，
    // 而不是只数顶层那几个（原来的写法会让"N 张图片"和"M 个文件夹"对不上）
    currentFolderCount = recursiveMode ? dirCount : sortedFolders.length;
    scanTruncated = truncated;

    // Build image entries
    const imgEntries = sortedImages.map(img => ({
      name: img.name,
      file: img.file,
      rel: img.rel,
      dirPath: img.dirPath,
      thumbUrl: null,
      width: 0,
      height: 0,
      aspect: 1,
      unsupported: isNoDecodeName(img.name),   // 浏览器解不了的格式（HEIC 等），单独标注
      _thumbQueued: false,
      _thumbFailed: false,
      _currentImgEl: null,
      _currentCardEl: null,
    }));

    currentImages = imgEntries;
    thumbQueue = [];
    thumbQueueIdx = 0;
    thumbWorkersRunning = 0;
    // 「解不了」的格式不会进缩略图队列，先计入已完成，
    // 否则 done 永远追不上 total，进度会一直停在"正在生成缩略图"
    thumbDoneCount = imgEntries.length ? imgEntries.filter(e => e.unsupported).length : 0;
    thumbFailedCount = 0;
    thumbFailedNames = [];
    $counter.title = '';
    $counter.style.color = '';

    $gallery.innerHTML = '';

    // Folders (NOT virtualized)
    if (sortedFolders.length) {
      const sec = document.createElement('div');
      sec.className = 'dir-section';
      const h = document.createElement('h3');
      h.textContent = `文件夹 (${sortedFolders.length})`;
      sec.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const f of sortedFolders) {
        const card = document.createElement('div');
        card.className = 'card folder-card';
        card.innerHTML = `<span class="folder-icon">&#128193;</span><span class="label">${esc(f.name)}</span>`;
        card.addEventListener('click', () => navigateTo([...currentPath, f.name]));
        card._folderHandle = f.handle;
        card._folderName = f.name;
        grid.appendChild(card);
      }
      sec.appendChild(grid);
      $gallery.appendChild(sec);
    }

    // Images — virtual scrolling
    if (imgEntries.length) {
      const sec = document.createElement('div');
      sec.className = 'dir-section';
      const h = document.createElement('h3');
      h.textContent = truncated
        ? `图片 (${imgEntries.length}，已达 ${SCAN_LIMIT} 张上限)`
        : `图片 (${imgEntries.length})`;
      sec.appendChild(h);

      $scrollContainer = document.createElement('div');
      $scrollContainer.className = 'vs-container';
      $spacer = document.createElement('div');
      $spacer.className = 'vs-spacer';
      $scrollContainer.appendChild($spacer);
      sec.appendChild($scrollContainer);
      $gallery.appendChild(sec);
    }

    if (!sortedFolders.length && !imgEntries.length) {
      $gallery.innerHTML = '<p style="text-align:center;padding:60px;color:var(--text-muted)">此目录下没有图片或子文件夹。</p>';
    }

    // Counter & breadcrumbs
    updateCounterLabel(imgEntries.length, currentFolderCount);
    renderBreadcrumbs();

    $loading.classList.remove('show');
    $gallery.style.display = 'block';

    // Initialize virtual scroll
    if (imgEntries.length && $scrollContainer) {
      // Load cached aspect ratios from OPFS
      await loadAspectRatios(currentDirPath, imgEntries, gen);
      if (gen !== thumbGeneration) return;

      // 预测量：只读文件头拿宽高比，让下面的布局一次到位。
      // 否则布局只能按正方形猜，再靠解码缩略图一张张纠正、反复重排。
      await premeasureAspects(imgEntries, gen);
      if (gen !== thumbGeneration) return;

      recalculateLayout();
      setupVirtualScroll();
      renderVisibleRows();
    }

    // Load folder preview thumbnails (async, low priority)
    if (sortedFolders.length) {
      const folderCards = [...$gallery.querySelectorAll('.folder-card')];
      loadFolderPreviews(folderCards, gen);
    }
  } catch (e) {
    if (gen === thumbGeneration) {
      $gallery.innerHTML = `<p style="text-align:center;padding:60px;color:#f66">读取目录出错：${esc(e.message)}</p>`;
      $loading.classList.remove('show');
      $gallery.style.display = 'block';
    }
  }
}

// ---- Aspect ratio OPFS cache ----
async function loadAspectRatios(dirPath, entries, gen) {
  if (!cacheDir) return;
  const arKey = arCacheKey(dirPath);
  let ratios = {};
  try {
    const fh = await cacheDir.getFileHandle(arKey);
    const f = await fh.getFile();
    ratios = JSON.parse(await f.text());
  } catch (e) { /* no cache yet */ }

  let anyNew = false;
  for (const entry of entries) {
    const key = `${entry.name}_${entry.file.size}_${entry.file.lastModified}`;
    if (ratios[key] && typeof ratios[key].w === 'number' && typeof ratios[key].h === 'number' && ratios[key].h > 0) {
      entry.width = ratios[key].w;
      entry.height = ratios[key].h;
      entry.aspect = ratios[key].w / ratios[key].h;
    }
  }
}

// ---- 预测量：只读文件头拿宽高比 ----
// readImageSize() 只读前 256KB，拿不到会返回 null，此时保持 width=0，
// 交给后面的缩略图流程兜底 —— 所以这条路走不通也不会比原来更差。
const PREMEASURE_CONCURRENCY = 24;

async function premeasureAspects(entries, gen) {
  // 注意：条目初始化时 aspect 就是 1（正方形），只有 width=0 才代表"还没测过"。
  // unsupported（HEIC 等）直接跳过，省掉 256KB 的无效读取。
  const todo = entries.filter(e => !(e.width > 0) && !e.unsupported);
  if (!todo.length) return;

  let cursor = 0;
  let done = 0;
  const total = todo.length;

  async function worker() {
    while (cursor < todo.length) {
      const entry = todo[cursor++];
      if (gen !== thumbGeneration) return;
      try {
        // RAW 解不出尺寸头，改用内嵌预览图的尺寸（比例一致，够布局用）
        const s = isRawName(entry.name)
          ? await readRawPreview(entry.file)
          : await readImageSize(entry.file);
        if (s && s.w > 0 && s.h > 0) {
          entry.width = s.w;
          entry.height = s.h;
          entry.aspect = s.w / s.h;
        }
      } catch (e) { /* 测不到就留给缩略图阶段 */ }
      done++;
      if (gen === thumbGeneration) {
        $counter.textContent = `正在测量尺寸 (${done}/${total})…`;
      }
    }
  }

  const workers = [];
  const n = Math.min(PREMEASURE_CONCURRENCY, total);
  for (let i = 0; i < n; i++) workers.push(worker());
  await Promise.all(workers);
  if (gen !== thumbGeneration) return;

  // 落盘缓存：下次进同一目录连文件头都不用读，直接命中
  saveAspectRatios(currentDirPath, entries);
  // 恢复常规计数文案，别停在"正在测量尺寸"
  updateCounterLabel(entries.length, currentFolderCount);
}

async function saveAspectRatios(dirPath, entries) {
  if (!cacheDir) return;
  const arKey = arCacheKey(dirPath);
  const ratios = {};
  for (const entry of entries) {
    if (entry.width > 0) {
      const key = `${entry.name}_${entry.file.size}_${entry.file.lastModified}`;
      ratios[key] = { w: entry.width, h: entry.height };
    }
  }
  try {
    const fh = await cacheDir.getFileHandle(arKey, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(ratios));
    await w.close();
  } catch (e) { /* ignore */ }
}

// ---- EXIF Parser ----
const exifCache = new Map();

function exifCacheKey(file) { return `${file.name}_${file.size}_${file.lastModified}`; }

async function parseExif(file) {
  const key = exifCacheKey(file);
  if (exifCache.has(key)) return exifCache.get(key);
  const result = await _parseExif(file);
  exifCache.set(key, result);
  return result;
}

// 尼康的镜头规格不在 ExifIFD（它连 LensModel 0xA434 都没有），而是藏在 MakerNote 的 0x0084：
// 'Nikon\0' + 版本(2B) + 内嵌 TIFF 头，IFD0 的 0x0084 = 4 个 RATIONAL
// （最短焦距、最长焦距、两端最大光圈）。结构任何一处不符就返回 null ——
// 宁可不显示，也不能把错误的镜头名显示给用户。
function readNikonLens(view, off, len) {
  try {
    if (len < 18) return null;
    const sig = String.fromCharCode(view.getUint8(off), view.getUint8(off + 1), view.getUint8(off + 2),
      view.getUint8(off + 3), view.getUint8(off + 4), view.getUint8(off + 5));
    if (sig !== 'Nikon\0') return null;
    const t = off + 10;                                  // 内嵌 TIFF 头的绝对偏移
    const bo = view.getUint8(t);
    if (bo !== 0x49 && bo !== 0x4D) return null;
    const le = bo === 0x49;
    if (view.getUint16(t + 2, le) !== 0x2A) return null;
    const end = off + len;
    const ifd = t + view.getUint32(t + 4, le);
    if (ifd + 2 > end) return null;
    const cnt = view.getUint16(ifd, le);
    for (let i = 0; i < cnt; i++) {
      const p = ifd + 2 + i * 12;
      if (p + 12 > end) return null;
      if (view.getUint16(p, le) === 0x0084) {
        if (view.getUint16(p + 2, le) !== 5 || view.getUint32(p + 4, le) < 4) return null;   // 必须是 RATIONAL x4
        const vo = t + view.getUint32(p + 8, le);
        if (vo + 32 > end) return null;
        const rat = (o) => { const num = view.getUint32(o, le), den = view.getUint32(o + 4, le); return den ? num / den : 0; };
        const fMin = rat(vo), fMax = rat(vo + 8), aMin = rat(vo + 16), aMax = rat(vo + 24);
        // 合理性检查：焦距 4~2000mm、光圈 f/0.7~f/64，且范围的两端不能颠倒
        if (!(fMin >= 4 && fMax >= fMin && fMax <= 2000 && aMin >= 0.7 && aMax >= aMin && aMax <= 64)) return null;
        const focal = fMin === fMax ? `${Math.round(fMin)}mm` : `${Math.round(fMin)}-${Math.round(fMax)}mm`;
        const apt = Math.abs(aMin - aMax) < 0.05 ? `f/${+aMin.toFixed(1)}` : `f/${+aMin.toFixed(1)}-${+aMax.toFixed(1)}`;
        return `${focal} ${apt}`;
      }
    }
    return null;
  } catch (e) { return null; }
}

// 解析一段 TIFF 结构里的 EXIF（tiffStart 指向 II/MM 标志）：
// JPEG 的 APP1 和 RAW 容器（本身就是 TIFF）共用这一份实现。
function readExifTags(view, byteLength, tiffStart) {
  const bo = view.getUint16(tiffStart);
  const le = bo === 0x4949;
  if (!le && bo !== 0x4D4D) return null;
  const g16 = (o) => view.getUint16(tiffStart + o, le);
  const g32 = (o) => view.getUint32(tiffStart + o, le);
  const firstIFD = g32(4);
  let makerNoteOff = 0, makerNoteLen = 0;   // MakerNote(0x927C) 在缓冲区里的绝对位置
  function readTagValue(type, count, valueOffset) {
    if (type === 2) { // ASCII
      let s = '';
      const maxLen = Math.min(count - 1, byteLength - (tiffStart + valueOffset));
      for (let i = 0; i < maxLen; i++) s += String.fromCharCode(view.getUint8(tiffStart + valueOffset + i));
      return s.trim();
    }
    if (type === 3) return g16(valueOffset); // SHORT
    if (type === 4) return g32(valueOffset); // LONG
    if (type === 5) { // RATIONAL
      const num = g32(valueOffset), den = g32(valueOffset + 4);
      return den ? num / den : 0;
    }
    return null;
  }
  function readIFD(ifdOffset) {
    const entries = {};
    const count = g16(ifdOffset);
    for (let i = 0; i < count; i++) {
      const eo = ifdOffset + 2 + i * 12;
      if (tiffStart + eo + 12 > byteLength) break;
      const tag = g16(eo), type = g16(eo + 2), cnt = g32(eo + 4);
      // 完整的类型长度表：漏掉 7(UNDEFINED)/10(SRATIONAL) 会把 MakerNote 这类
      // 「大块数据」的偏移算成内联值，导致整段解析全错
      const typeSize = { 1:1, 2:1, 3:2, 4:4, 5:8, 6:1, 7:1, 8:2, 9:4, 10:8, 11:4, 12:8, 13:4 }[type] || 0;
      let vo;
      if (typeSize * cnt <= 4) { vo = eo + 8; }
      else { vo = g32(eo + 8); }
      if (tiffStart + vo + typeSize * cnt > byteLength) continue;
      if (tag === 0x927C && type === 7 && cnt > 0 && tiffStart + vo + cnt <= byteLength) {
        makerNoteOff = tiffStart + vo; makerNoteLen = cnt;
      }
      entries[tag] = readTagValue(type, cnt, vo);
    }
    return entries;
  }
  const ifd0 = readIFD(firstIFD);
  const tags = {};
  tags.Make = ifd0[0x010F] || '';
  tags.Model = ifd0[0x0110] || '';
  const o = ifd0[0x0112];
  if (typeof o === 'number' && o >= 1 && o <= 8) tags.Orientation = o;
  let exifIFD = null;
  if (ifd0[0x8769]) exifIFD = readIFD(ifd0[0x8769]);
  if (exifIFD) {
    tags.ExposureTime = exifIFD[0x829A];
    tags.FNumber = exifIFD[0x829D];
    tags.ISO = exifIFD[0x8827];
    tags.DateTimeOriginal = exifIFD[0x9003];
    tags.FocalLength = exifIFD[0x920A];
    tags.LensModel = exifIFD[0xA434];
    tags.PixelXDimension = exifIFD[0xA002];
    tags.PixelYDimension = exifIFD[0xA003];
  }
  // 尼康只有 MakerNote 里有镜头规格，补上（其它品牌在 0xA434，上面已经读到）
  if (!tags.LensModel && makerNoteOff) {
    const lens = readNikonLens(view, makerNoteOff, makerNoteLen);
    if (lens) tags.LensModel = lens;
  }
  return tags;
}

async function _parseExif(file) {
  // RAW 容器本身就是 TIFF（CR2/NEF/ARW/DNG...）：直接从头部的 IFD0 + ExifIFD 里读。
  // 实测尼康/索尼的 ExifIFD 都落在文件头 256KB 内，够用；CR3 不是 TIFF 容器，读不到。
  if (isRawName(file.name)) {
    try {
      const buf = await file.slice(0, RAW_HEAD).arrayBuffer();
      const b = new Uint8Array(buf);
      const isTiff = (b[0] === 0x49 && b[1] === 0x49 && b[2] === 0x2A && b[3] === 0x00)
                  || (b[0] === 0x4D && b[1] === 0x4D && b[2] === 0x00 && b[3] === 0x2A);
      if (!isTiff) return null;
      return readExifTags(new DataView(buf), b.length, 0);
    } catch (e) { return null; }
  }
  if (!file.type || (!file.type.includes('jpeg') && !file.name.toLowerCase().match(/\.jpe?g$/))) return null;
  try {
    const buf = await file.slice(0, 65536).arrayBuffer();
    const view = new DataView(buf);
    if (view.getUint16(0) !== 0xFFD8) return null;
    let offset = 2;
    while (offset < view.byteLength - 4) {
      const marker = view.getUint16(offset);
      if (marker === 0xFFE1) { // APP1
        const exifStart = offset + 4;
        // Check "Exif\0\0"
        if (view.getUint32(exifStart) !== 0x45786966 || view.getUint16(exifStart + 4) !== 0x0000) return null;
        return readExifTags(view, buf.byteLength, exifStart + 6);
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      offset += 2 + view.getUint16(offset + 2);
    }
    return null;
  } catch (e) { return null; }
}

function formatShutter(v) {
  if (!v) return null;
  if (v >= 1) return v + 's';
  return '1/' + Math.round(1 / v) + 's';
}
function formatAperture(v) { return v ? 'f/' + v.toFixed(1) : null; }
function formatFocalLength(v) { return v ? Math.round(v) + 'mm' : null; }

// EXIF Orientation(0x0112) -> 中文说明（1 = 不需要任何变换）
function formatOrientation(o) {
  switch (o) {
    case 2: return '水平镜像';
    case 3: return '旋转 180°';
    case 4: return '垂直镜像';
    case 5: return '沿对角线镜像';
    case 6: return '顺时针旋转 90°';
    case 7: return '镜像后旋转 90°';
    case 8: return '逆时针旋转 90°';
    default: return '';
  }
}
